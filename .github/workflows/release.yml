name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    # requires the "nuget" environment (holds NUGET_API_KEY; configure required reviewers there for a manual gate)
    environment: nuget
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # only publish tags whose commit is reachable from main — a tag on a stray branch must not become a release
      - name: Verify the tagged commit is on main
        run: |
          git fetch origin main --depth=0
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of origin/main; refusing to publish."; exit 1; }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      # version comes from the tag: v0.1.0-alpha.1 → 0.1.0-alpha.1
      - run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -p:Version=$VERSION
      - run: dotnet build tests/Thalos.NET.Tests.McpServer -c Release --no-restore -p:Version=$VERSION
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=tests.trx"
      - run: dotnet pack --no-build -c Release -o artifacts/packages -p:Version=$VERSION
      - uses: actions/upload-artifact@v4
        with: { name: packages, path: artifacts/packages }
      - run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
