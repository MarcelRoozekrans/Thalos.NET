name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      # version comes from the tag: v0.1.0-alpha.1 → 0.1.0-alpha.1
      - run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -p:Version=$VERSION
      - run: dotnet build tests/Thalos.NET.Tests.McpServer -c Release --no-restore -p:Version=$VERSION
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=tests.trx"
      - run: dotnet pack --no-build -c Release -o artifacts/packages -p:Version=$VERSION
      - uses: actions/upload-artifact@v4
        with: { name: packages, path: artifacts/packages }
      - run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
