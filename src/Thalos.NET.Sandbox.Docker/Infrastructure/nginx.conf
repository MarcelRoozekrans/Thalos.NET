# Thalos sandbox gateway. Included inside http {} as conf.d/default.conf.
# The remainder of the path is taken from the raw $request_uri, so encoded paths such as a%2Fb reach the
# sandbox unchanged instead of being decoded and rebuilt.
map $request_uri $sbx_rest {
    "~^/sandboxes/[0-9a-f]{32}(?<r>/[^?]*)" $r;
    default "/";
}

# The id as the client sent it. nginx matches locations on the normalised URI, so a request such as
# /sandboxes/<a>/%2e%2e/<b>/ matches <b>; it is proxied only when the raw id and the matched id agree.
map $request_uri $sbx_raw_sid {
    "~^/sandboxes/(?<s>[0-9a-f]{32})/" $s;
    default "";
}

server {
    listen 8080;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 512m;

    # Only a 32-hex sandbox id is routable; anything else is a 404 and never proxied.
    # The regex is quoted: an unquoted {32} ends the token and nginx refuses to start.
    location ~ "^/sandboxes/(?<sid>[0-9a-f]{32})/" {
        if ($sbx_raw_sid != $sid) { return 404; }
        proxy_pass http://thalos-sandbox-$sid:8080$sbx_rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location / { return 404; }
}
